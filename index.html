<!DOCTYPE html>
<html>
<head>
    <title>Bookmark Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Bookmark Maker</h1>

        <form id="bookmarkForm">
            <label for="siteNameInput">Site Name</label>
            <input type="text" id="siteNameInput">
            <p id="siteNameErrMsg" class="error"></p>

            <label for="siteUrlInput">Site URL</label>
            <input type="text" id="siteUrlInput">
            <p id="siteUrlErrMsg" class="error"></p>

            <button id="submitBtn" type="submit">Submit</button>
        </form>

        <ul id="bookmarksList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
